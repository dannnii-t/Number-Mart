<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>숫자 마트 장보기</title>
<style>

#numberMartApp{--u:min(1vw,1.78vh);--ink:#4A3B32;--red:#FF6B6B;--yel:#FFD23F;--grn:#3DBE7A;--blu:#4DA3FF;--org:#FF9F1C;--wall:#FFF1CC;--floor:#F2BE82;
--fb:calc(var(--u)*2.3);--fe:calc(var(--u)*6.4);--fk:calc(var(--u)*4.6);--ft:calc(var(--u)*2.5);--face:calc(var(--u)*8);--fh:calc(var(--u)*2.1);
position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;color:var(--ink);
font-family:"Jua","Gowun Dodum","BM JUA","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
background:linear-gradient(to bottom,var(--wall) 0,var(--wall) 84%,var(--floor) 84%,var(--floor) 100%);
-webkit-user-select:none;user-select:none;touch-action:manipulation}
#numberMartApp,#numberMartApp *{box-sizing:border-box}
#numberMartApp button{font:inherit;color:inherit;border:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
#numberMartApp button:focus-visible{outline:4px solid var(--blu);outline-offset:2px}
#numberMartApp .nm-screen{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column}
#numberMartApp .nm-screen.on{display:flex}
#numberMartApp .nm-top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;height:calc(var(--u)*7);padding:0 calc(var(--u)*2);background:var(--red);color:#fff;font-size:var(--ft);font-weight:900}
#numberMartApp .nm-pill{background:#fff;color:var(--ink);border-radius:999px;padding:0 calc(var(--u)*1.8);line-height:calc(var(--u)*4.4);min-height:48px;display:flex;align-items:center;white-space:nowrap}
#numberMartApp .nm-awn{flex:0 0 auto;height:calc(var(--u)*2);background:repeating-linear-gradient(90deg,#fff 0,#fff calc(var(--u)*4),#FFB3B3 calc(var(--u)*4),#FFB3B3 calc(var(--u)*8));box-shadow:0 4px 0 rgba(74,59,50,.12)}
#numberMartApp .nm-main{flex:1;min-height:0;display:grid;grid-template-columns:1.55fr 1fr;gap:calc(var(--u)*1.6);padding:calc(var(--u)*1.6) calc(var(--u)*2)}
#numberMartApp .nm-left{display:flex;flex-direction:column;min-height:0;min-width:0;gap:calc(var(--u)*.8)}
#numberMartApp .nm-cust{flex:0 0 auto;display:flex;align-items:center;gap:calc(var(--u)*1.4)}
#numberMartApp .nm-face{flex:0 0 auto;font-size:var(--face);line-height:1}
#numberMartApp .nm-bubble{position:relative;flex:1;min-width:0;background:#fff;border:3px solid #F0D49A;border-radius:calc(var(--u)*2);padding:calc(var(--u)*1.2) calc(var(--u)*1.6);font-size:var(--fb);font-weight:800;line-height:1.35;display:flex;align-items:center;gap:calc(var(--u)*1)}
#numberMartApp .nm-bubble::before{content:"";position:absolute;left:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid #F0D49A;border-left:0}
#numberMartApp .nm-spk{flex:0 0 auto;width:max(48px,calc(var(--u)*4.4));height:max(48px,calc(var(--u)*4.4));border-radius:50%;background:var(--yel);font-size:var(--ft)}
#numberMartApp .nm-expr{overflow:hidden;flex:0 0 auto;text-align:center;font-size:var(--fe);font-weight:900;line-height:1.15;background:#fff;border-radius:calc(var(--u)*2);padding:calc(var(--u)*.5) 0;letter-spacing:.06em;white-space:nowrap}
#numberMartApp .nm-q{display:inline-block;min-width:1em;height:1em;line-height:1em;vertical-align:-.08em;margin:0 .06em;background:var(--yel);border-radius:.18em;color:var(--ink)}
#numberMartApp .nm-hint{flex:0 0 auto;min-height:calc(var(--u)*3.6);font-size:var(--fh);font-weight:800;line-height:1.3;text-align:center;color:#2D7FD1;display:flex;align-items:center;justify-content:center}

#numberMartApp .nm-pic{position:relative;flex:1;min-height:0;min-width:0;background:rgba(255,255,255,.7);border-radius:calc(var(--u)*2);border-bottom:calc(var(--u)*1) solid #C98B4A;overflow:hidden}
#numberMartApp .nm-tray{height:100%;display:grid;grid-template-columns:repeat(5,var(--cell,40px));grid-auto-rows:var(--cell,40px);gap:calc(var(--cell,40px)*.08);justify-content:center;align-content:center}

#numberMartApp .nm-c b{position:absolute;right:-6%;top:-6%;width:1.2em;height:1.2em;line-height:1.2em;font-size:.55em;text-align:center;border-radius:50%;background:var(--blu);color:#fff}
#numberMartApp .nm-pad{display:flex;flex-direction:column;min-height:0;min-width:0;gap:calc(var(--u)*1);background:rgba(255,255,255,.55);border-radius:calc(var(--u)*2);padding:calc(var(--u)*1.2)}
#numberMartApp .nm-row{flex:0 0 auto;display:flex;gap:calc(var(--u)*1);height:calc(var(--u)*7.6)}
#numberMartApp .nm-disp{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;background:#fff;border:4px solid var(--yel);border-radius:calc(var(--u)*1.6);font-size:calc(var(--u)*5.6);font-weight:900}

#numberMartApp .nm-keys{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:calc(var(--u)*1)}
#numberMartApp .nm-keys button{min-height:48px;min-width:48px;background:#fff;border-radius:calc(var(--u)*1.6);font-size:var(--fk);font-weight:900;box-shadow:0 .5vmin 0 #E3C27A}

#numberMartApp .nm-keys .del{background:#FFD9A8;font-size:calc(var(--fk)*.55)}

#numberMartApp .nm-card{max-width:86%;background:#fff;border-radius:calc(var(--u)*3);padding:calc(var(--u)*2.4) calc(var(--u)*4);text-align:center;animation:nmpop .35s}

#numberMartApp .nm-card .pt{font-size:calc(var(--u)*3);color:var(--org);font-weight:900}
#numberMartApp .nm-big{min-height:48px;padding:0 calc(var(--u)*5);height:calc(var(--u)*8);background:var(--grn);color:#fff;border-radius:999px;font-size:calc(var(--u)*3.6);font-weight:900;box-shadow:0 .6vmin 0 #249B5C}
#numberMartApp .nm-big.alt{background:var(--blu);box-shadow:0 .6vmin 0 #2D7FD1}
#numberMartApp .nm-sm{min-height:48px;padding:0 calc(var(--u)*2.4);height:calc(var(--u)*4.6);background:#fff;border-radius:999px;font-size:var(--fh);font-weight:800;box-shadow:0 3px 0 #E3C27A}
#numberMartApp .nm-center{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.6);padding:calc(var(--u)*2);text-align:center}
#numberMartApp .nm-shelf{max-width:100%;font-size:calc(var(--u)*4.4);letter-spacing:.2em;background:rgba(255,255,255,.7);border-bottom:calc(var(--u)*.8) solid #C98B4A;border-radius:calc(var(--u)*1.5);padding:0 calc(var(--u)*2)}
#numberMartApp .nm-sign{max-width:100%;font-size:calc(var(--u)*6);font-weight:900;color:#fff;background:var(--red);border:calc(var(--u)*.6) solid #fff;border-radius:calc(var(--u)*2.4);padding:calc(var(--u)*1) calc(var(--u)*4);box-shadow:0 .8vmin 0 #D94B4B}

#numberMartApp .nm-lvls{display:none;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*1.1);width:min(96%,calc(var(--u)*100));max-height:calc(var(--u)*46);overflow-y:auto;-webkit-overflow-scrolling:touch}

#numberMartApp .nm-list{width:min(94%,calc(var(--u)*80));flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#numberMartApp .nm-item{background:#fff;border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*1) calc(var(--u)*2);margin-bottom:calc(var(--u)*1);text-align:left;font-size:var(--fh);font-weight:800;line-height:1.4}
#numberMartApp .nm-item .ex{font-size:calc(var(--u)*3.4);font-weight:900}
 #numberMartApp .nm-start.pick .nm-shelf,#numberMartApp .nm-start.pick .nm-sign{display:none}
#numberMartApp .nm-card2.wide{width:min(96%,calc(var(--u)*100))}
#numberMartApp .nm-bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--u)*30),1fr));column-gap:calc(var(--u)*3)}
#numberMartApp .nm-fr{height:auto;--cell:calc(var(--s)*1.5)}

#numberMartApp .nm-scene{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:center;gap:calc(var(--s)*1.2);padding:calc(var(--s)*.4)}
#numberMartApp .nm-bw{display:flex;flex-direction:column;align-items:center}

#numberMartApp .nm-rod.gone::after,#numberMartApp .nm-cube.gone::after{content:"✖";position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#FF4D4D;font-size:1.1em;line-height:1}

#numberMartApp .nm-cube b{top:50%;margin-top:-.8em}

#numberMartApp .nm-lr{display:inline-block;width:calc(var(--u)*.7);height:calc(var(--u)*2.2);background:#FFC145;border-radius:3px}

#numberMartApp .nm-praise{font-size:var(--ft);font-weight:800;line-height:1.35;max-width:92%}

<body>
<div id="numberMartApp"></div>
<script>
(function () {
  'use strict';
  var root = document.getElementById('numberMartApp');
  if (!root) return;

  /* ---------- 기본 데이터 ---------- */
  var TOTAL = 10;
  var PRODUCTS = [['🍎','사과'],['🥛','우유'],['🍞','빵'],['🥕','당근'],['🍌','바나나'],['🍪','쿠키'],['🥚','달걀'],['🍓','딸기'],['🍇','포도'],['🍊','귤']];
  var CUSTOMERS = ['🐻','🐰','🐱','🐶','🐼','🦊','🐸','🐷','🐥','🐨','🐹','🐵','🦁','🐯','🐮'];

  function q(s) { return root.querySelector(s); }
  function qa(s) { return Array.prototype.slice.call(root.querySelectorAll(s)); }
  function r(n) { return root.querySelector('[data-r="' + n + '"]'); }
  function sGet(k) { try { return window.localStorage.getItem('numberMart_' + k); } catch (e) { return null; } }
  function sSet(k, v) { try { window.localStorage.setItem('numberMart_' + k, String(v)); } catch (e) {} }
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(arr) { return arr[rnd(0, arr.length - 1)]; }
  function shuffle(arr) { var a = arr.slice(), i, j, t; for (i = a.length - 1; i > 0; i--) { j = rnd(0, i); t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function jong(w) { var c = w.charCodeAt(w.length - 1) - 0xAC00; return c >= 0 && c % 28 !== 0; }
  function josa(w, withJong, noJong) { return w + (jong(w) ? withJong : noJong); }
  function rep(n, e, cls, cnt) { var o = [], i; for (i = 0; i < n; i++) o.push({ e: e, cls: cls || '', cnt: !!cnt }); return o; }

  function bat(n) { return [0, 1, 3, 6, 7, 8].indexOf(n % 10) >= 0; }
  function nj(n, w, wo) { return n + (bat(n) ? w : wo); }
  function nro(n) { var d = n % 10; return n + ((bat(n) && d !== 1 && d !== 7 && d !== 8) ? '으로' : '로'); }
  function ie(n) { return n + (bat(n) ? '이에요.' : '예요.'); }
  function blk(n, cls, cnt) { var o = [], i; for (i = 0; i < n; i++) o.push({ cls: cls || '', cnt: !!cnt }); return o; }
  function pad10(a) { while (a.length < 10) a.push({ e: '', cls: 'empty', cnt: false }); return a; }
  function range(ids) {
    var out = [], i = 0, j;
    while (i < ids.length) { j = i; while (j + 1 < ids.length && ids[j + 1] === ids[j] + 1) j++; out.push(j > i ? ids[i] + '~' + ids[j] : '' + ids[i]); i = j + 1; }
    return out.join(', ') + '단계';
  }

  /* ---------- 단계별 문제 생성 함수 (6~13단계는 여기에 추가) ---------- */
  function makeL1() {
    var a = rnd(1, 8), b = rnd(1, Math.min(8, 9 - a)), P = pick(PRODUCTS), Q;
    do { Q = pick(PRODUCTS); } while (Q === P);
    return {
      type: '모으기', expr: a + ' + ' + b + ' = ?', answer: a + b, prod: P[0],
      key: 'L1:' + a + '+' + b,
      story: P[1] + ' ' + a + '개와 ' + Q[1] + ' ' + b + '개를 샀어요. 모두 몇 개일까요?',
      cells: rep(a, P[0], '', true).concat(rep(b, Q[0], 'add', true)),
      hint: a + '개와 ' + b + '개를 모아서 하나씩 세어 봐요.',
      explain: a + '개와 ' + b + '개를 모으면 ' + (a + b) + '개예요.'
    };
  }
  function makeL2() {
    var a = rnd(2, 9), b = rnd(1, a), P = pick(PRODUCTS), rest = a - b;
    return {
      type: '가르기', expr: a + ' − ' + b + ' = ?', answer: rest, prod: P[0],
      key: 'L2:' + a + '-' + b,
      story: josa(P[1], '이', '가') + ' ' + a + '개 있어요. ' + b + '개를 팔았어요. 몇 개 남았을까요?',
      cells: rep(rest, P[0], '', true).concat(rep(b, P[0], 'gone', false)),
      hint: a + '개를 ' + b + '개와 □개로 가르기 해요. 남은 것을 세어 봐요.',
      explain: a + '개를 ' + b + '개와 ' + rest + '개로 가를 수 있어요. ' + b + '개를 팔면 ' + rest + '개가 남아요.'
    };
  }
  function makeL3() {
    var t, a, b, c, m, res, ok = false, P = pick(PRODUCTS), cells = [], i, n, story, expr, o1, o2, tname;
    while (!ok) {
      t = pick(['aa', 'ss', 'as']);
      a = rnd(1, 9); b = rnd(1, 9); c = rnd(1, 9);
      if (t === 'aa') { m = a + b; res = m + c; ok = m <= 9 && res <= 9; }
      else if (t === 'ss') { m = a - b; res = m - c; ok = m >= 0 && res >= 0; }
      else { m = a + b; res = m - c; ok = m <= 9 && res >= 0; }
    }
    o1 = t === 'ss' ? '−' : '+'; o2 = t === 'aa' ? '+' : '−';
    expr = a + ' ' + o1 + ' ' + b + ' ' + o2 + ' ' + c + ' = ?';
    if (t === 'aa') {
      cells = rep(a, P[0], '', true).concat(rep(b, P[0], 'add', true), rep(c, P[0], 'add2', true));
      story = josa(P[1], '이', '가') + ' ' + a + '개 있어요. ' + b + '개를 더 놓고, ' + c + '개를 또 놓았어요. 모두 몇 개일까요?';
      tname = '더하기 + 더하기';
    } else if (t === 'ss') {
      for (i = 0; i < a; i++) {
        if (i >= a - b) cells.push({ e: P[0], cls: 'gone', cnt: false });
        else if (i >= a - b - c) cells.push({ e: P[0], cls: 'gone2', cnt: false });
        else cells.push({ e: P[0], cls: '', cnt: true });
      }
      story = josa(P[1], '이', '가') + ' ' + a + '개 있어요. ' + b + '개를 팔고, ' + c + '개를 또 팔았어요. 몇 개 남았을까요?';
      tname = '빼기 + 빼기';
    } else {
      cells = rep(a, P[0], '', true).concat(rep(b, P[0], 'add', true));
      n = cells.length;
      for (i = n - c; i < n; i++) { cells[i].cls = 'gone2'; cells[i].cnt = false; }
      story = josa(P[1], '이', '가') + ' ' + a + '개 있어요. ' + b + '개를 더 놓고, ' + c + '개를 팔았어요. 몇 개 남았을까요?';
      tname = '더하고 빼기';
    }
    return {
      type: tname, expr: expr, answer: res, prod: P[0],
      key: 'L3:' + t + a + b + c, story: story, cells: cells,
      hint: '앞에서부터 차례로 계산해요. 먼저 ' + a + ' ' + o1 + ' ' + b + ' = ' + m + '이에요.',
      explain: '앞에서부터 차례로 계산해요. ' + a + ' ' + o1 + ' ' + b + ' = ' + m + ', ' + m + ' ' + o2 + ' ' + c + ' = ' + res + '.'
    };
  }
  function makeL4() {
    var form = pick(['a', 'b']), x = rnd(1, 9), ans = 10 - x, P = pick(PRODUCTS), cells, story, expr, tname;
    if (form === 'a') {
      expr = x + ' + □ = 10';
      story = josa(P[1], '이', '가') + ' ' + x + '개 있어요. 10개가 되려면 몇 개가 더 필요할까요?';
      cells = rep(x, P[0], '', false); tname = '10 만들기 (앞의 수를 알 때)';
    } else {
      expr = '□ + ' + x + ' = 10';
      story = josa(P[1], '이', '가') + ' 몇 개 있어요. ' + x + '개를 더 넣었더니 10개가 되었어요. 처음에 몇 개 있었을까요?';
      cells = rep(x, P[0], 'add', false); tname = '10 만들기 (뒤의 수를 알 때)';
    }
    cells = cells.concat(rep(ans, '', 'empty', true));
    return {
      type: tname, expr: expr, answer: ans, prod: P[0],
      key: 'L4:' + form + x, story: story, cells: cells,
      hint: x + '개와 몇 개를 모으면 10개가 될까요? 빈 칸을 세어 봐요.',
      explain: x + '개와 ' + ans + '개를 모으면 10개가 돼요.'
    };
  }
  function makeL5() {
    var a = rnd(1, 9), ans = 10 - a, P = pick(PRODUCTS);
    return {
      type: '10 가르기', expr: '10 − ' + a + ' = ?', answer: ans, prod: P[0],
      key: 'L5:' + a,
      story: P[1] + ' 10개 중에 ' + a + '개를 팔았어요. 몇 개 남았을까요?',
      cells: rep(ans, P[0], '', true).concat(rep(a, P[0], 'gone', false)),
      hint: '10개를 ' + a + '개와 □개로 가르기 해요. 남은 것을 세어 봐요.',
      explain: '10개를 ' + a + '개와 ' + ans + '개로 가를 수 있어요. ' + a + '개를 팔면 ' + ans + '개가 남아요.'
    };
  }

  function makeL6() {
    var a, b, P = pick(PRODUCTS), Q, need, rem, ans;
    do { a = rnd(2, 9); b = rnd(2, 9); } while (a + b < 11);
    do { Q = pick(PRODUCTS); } while (Q === P);
    need = 10 - a; rem = b - need; ans = a + b;
    return {
      type: '10을 만들어 더하기', expr: a + ' + ' + b + ' = ?', answer: ans, prod: P[0], key: 'L6:' + a + '+' + b,
      story: P[1] + ' ' + a + '개와 ' + Q[1] + ' ' + b + '개를 샀어요. 모두 몇 개일까요?',
      scene: function (h) {
        var A, B;
        if (!h) { A = rep(a, P[0]); B = rep(b, Q[0]); }
        else { A = rep(a, P[0]).concat(rep(need, Q[0], 'add')); B = rep(rem, Q[0]).concat(rep(need, '', 'empty')); }
        return [{ k: 'frame', cells: pad10(A) }, { k: 'op', t: '+' }, { k: 'frame', cells: pad10(B) }];
      },
      hint: a + '개에 ' + need + '개를 더해 10개를 만들어요. 남은 ' + rem + '개를 더하면 ?개예요.',
      explain: nj(a, '과', '와') + ' ' + nj(b, '을', '를') + ' 모아요. ' + a + '에 ' + nj(need, '을', '를') + ' 더해 10을 만들고, 남은 ' + nj(rem, '을', '를') + ' 더하면 ' + ie(ans)
    };
  }
  function makeL7() {
    var u, b, n, ans, P = pick(PRODUCTS);
    do { u = rnd(1, 8); b = rnd(2, 9); } while (b <= u);
    n = 10 + u; ans = 10 - b + u;
    return {
      type: '10에서 빼고 더하기', expr: n + ' − ' + b + ' = ?', answer: ans, prod: P[0], key: 'L7:' + n + '-' + b,
      story: josa(P[1], '이', '가') + ' ' + n + '개 있어요. ' + b + '개를 팔았어요. 몇 개 남았을까요?',
      scene: function (h) {
        var A = h ? rep(10 - b, P[0], '', true).concat(rep(b, P[0], 'gone')) : rep(10, P[0]);
        return [{ k: 'frame', cells: pad10(A) }, { k: 'op', t: '+' }, { k: 'frame', cells: pad10(rep(u, P[0], '', true)) }];
      },
      hint: '10개에서 ' + b + '개를 빼면 ' + (10 - b) + '개, 낱개 ' + u + '개와 합치면 ?개예요.',
      explain: nj(n, '은', '는') + ' 10과 ' + nro(u) + ' 갈라요. 10에서 ' + nj(b, '을', '를') + ' 빼면 ' + (10 - b) + ', ' + nj(10 - b, '과', '와') + ' ' + nj(u, '을', '를') + ' 더하면 ' + ie(ans)
    };
  }
  function makeL8() {
    var T = rnd(1, 9), o = rnd(1, 9), t = T * 10, ans = t + o, P = pick(PRODUCTS);
    return {
      type: '(몇십)+(몇)', expr: t + ' + ' + o + ' = ?', answer: ans, prod: P[0], key: 'L8:' + t + '+' + o,
      story: josa(P[1], '이', '가') + ' ' + t + '개 있어요. ' + o + '개를 더 가져왔어요. 모두 몇 개일까요?',
      scene: function (h) {
        return h ? [{ k: 'blocks', rods: blk(T), cubes: blk(o, 'alt') }]
                 : [{ k: 'blocks', rods: blk(T) }, { k: 'op', t: '+' }, { k: 'blocks', cubes: blk(o, 'alt') }];
      },
      hint: nj(t, '은', '는') + ' 십 모형 ' + T + '개, ' + nj(o, '은', '는') + ' 낱개 ' + o + '개예요. 합치면 ?',
      explain: nj(t, '은', '는') + ' 십 모형 ' + T + '개, ' + nj(o, '은', '는') + ' 낱개 ' + o + '개예요. 합치면 ' + ie(ans)
    };
  }
  function makeL9() {
    var Ta, Tb, a, b, ans, P = pick(PRODUCTS);
    do { Ta = rnd(1, 9); Tb = rnd(1, 9); } while (Ta + Tb > 10);
    a = Ta * 10; b = Tb * 10; ans = a + b;
    return {
      type: '(몇십)+(몇십)', expr: a + ' + ' + b + ' = ?', answer: ans, prod: P[0], key: 'L9:' + a + '+' + b,
      story: josa(P[1], '이', '가') + ' ' + a + '개 있어요. ' + b + '개를 더 가져왔어요. 모두 몇 개일까요?',
      scene: function (h) {
        return h ? [{ k: 'blocks', rods: blk(Ta, '', true).concat(blk(Tb, 'alt', true)) }]
                 : [{ k: 'blocks', rods: blk(Ta) }, { k: 'op', t: '+' }, { k: 'blocks', rods: blk(Tb, 'alt') }];
      },
      hint: '십 모형 ' + Ta + '개와 ' + Tb + '개를 모아요. 모두 몇 개인지 세면 몇십인지 알 수 있어요.',
      explain: '십 모형 ' + Ta + '개와 ' + Tb + '개를 모으면 ' + (Ta + Tb) + '개, ' + ie(ans)
    };
  }
  function makeL10() {
    var ta, tb, oa, ob, a, b, ans, P = pick(PRODUCTS);
    do { ta = rnd(1, 9); tb = rnd(1, 9); oa = rnd(1, 9); ob = rnd(1, 9); } while (ta + tb > 9 || oa + ob > 9);
    a = ta * 10 + oa; b = tb * 10 + ob; ans = a + b;
    return {
      type: '(몇십몇)+(몇십몇)', expr: a + ' + ' + b + ' = ?', answer: ans, prod: P[0], key: 'L10:' + a + '+' + b,
      story: josa(P[1], '이', '가') + ' ' + a + '개 있어요. ' + b + '개를 더 가져왔어요. 모두 몇 개일까요?',
      scene: function (h) {
        return h ? [{ k: 'blocks', title: '십의 자리', rods: blk(ta).concat(blk(tb, 'alt')) }, { k: 'blocks', title: '일의 자리', cubes: blk(oa).concat(blk(ob, 'alt')) }]
                 : [{ k: 'blocks', rods: blk(ta), cubes: blk(oa) }, { k: 'op', t: '+' }, { k: 'blocks', rods: blk(tb, 'alt'), cubes: blk(ob, 'alt') }];
      },
      hint: '십의 자리끼리 ' + ta + '+' + tb + ', 일의 자리끼리 ' + oa + '+' + ob + '. 합치면 ?',
      explain: '십의 자리끼리 ' + ta + '+' + tb + '=' + (ta + tb) + ', 일의 자리끼리 ' + oa + '+' + ob + '=' + (oa + ob) + ', 합치면 ' + ie(ans)
    };
  }
  function makeL11() {
    var T = rnd(2, 9), b = rnd(1, 9), t = T * 10, ans = (T - 1) * 10 + 10 - b, P = pick(PRODUCTS);
    return {
      type: '(몇십)−(몇)', expr: t + ' − ' + b + ' = ?', answer: ans, prod: P[0], key: 'L11:' + t + '-' + b,
      story: josa(P[1], '이', '가') + ' ' + t + '개 있어요. ' + b + '개를 팔았어요. 몇 개 남았을까요?',
      scene: function (h) {
        return h ? [{ k: 'blocks', rods: blk(T - 1) }, { k: 'op', t: '+' }, { k: 'blocks', title: '바꾼 낱개 10개', cubes: blk(10 - b).concat(blk(b, 'gone')) }]
                 : [{ k: 'blocks', rods: blk(T) }];
      },
      hint: '십 모형 1개를 낱개 10개로 바꿔요. 10개에서 ' + b + '개를 빼고, 십 모형 ' + (T - 1) + '개와 합치면 ?',
      explain: t + '에서 십 모형 1개를 낱개 10개로 바꿔요. 10에서 ' + nj(b, '을', '를') + ' 빼면 ' + (10 - b) + ', 남은 십 모형 ' + (T - 1) + '개와 합치면 ' + ie(ans)
    };
  }
  function makeL12() {
    var Ta = rnd(2, 9), Tb = rnd(1, Ta - 1), a = Ta * 10, b = Tb * 10, ans = (Ta - Tb) * 10, P = pick(PRODUCTS);
    return {
      type: '(몇십)−(몇십)', expr: a + ' − ' + b + ' = ?', answer: ans, prod: P[0], key: 'L12:' + a + '-' + b,
      story: josa(P[1], '이', '가') + ' ' + a + '개 있어요. ' + b + '개를 팔았어요. 몇 개 남았을까요?',
      scene: function () { return [{ k: 'blocks', rods: blk(Ta - Tb, '', true).concat(blk(Tb, 'gone')) }]; },
      hint: '십 모형 ' + Ta + '개에서 ' + Tb + '개를 빼요. 남은 십 모형을 세어 봐요.',
      explain: '십 모형 ' + Ta + '개에서 ' + Tb + '개를 빼면 ' + (Ta - Tb) + '개, ' + ie(ans)
    };
  }
  function makeL13() {

  function eul(w) {
    var i, c;
    for (i = w.length - 1; i >= 0; i--) { c = w.charCodeAt(i); if (c >= 0xAC00 && c <= 0xD7A3) return (c - 0xAC00) % 28 ? '을' : '를'; }
    return '를';
  }
  function qExpr(p) { return p.expr.replace('?', '<span class="nm-q">?</span>').replace('□', '<span class="nm-q"></span>'); }
  function showAnalysis() {
    if (G.main) G = G.main;
    var by = {}, order = [], help = 0, bad = [], lo = 1, hi = 0, rates = {}, msg, lows, bars, list = '', act, first = 0;
    G.res.forEach(function (x) {
      var t = x.p.level;
      if (!by[t]) { by[t] = { n: 0, f: 0 }; order.push(t); }
      by[t].n++;
      if (x.first) { by[t].f++; first++; } else bad.push(x);
      if (x.help) help++;
    });
    order.sort(numAsc);
    order.forEach(function (t) { var v = by[t].f / by[t].n; rates[t] = v; if (v < lo) lo = v; if (v > hi) hi = v; });
    if (order.length > 1 && lo === hi) msg = ['🌈', '모든 단계를 비슷하게 잘했어요!'];
    else if (lo === 1) msg = ['🌟', '이번 단계를 아주 잘 풀었어요!'];
    else {
      lows = order.filter(function (t) { return rates[t] === lo; });
      msg = ['💪', lows.map(function (t) { return '‘' + LEVELS[t - 1].name + '’'; }).join(', ') + eul(LEVELS[lows[lows.length - 1] - 1].name) + ' 조금 더 연습하면 좋아요!'];
    }
    bars = order.map(function (t) {
      var o = by[t], pc = Math.round(rates[t] * 100), low = lo !== hi && rates[t] === lo;
      return '<div class="nm-bar"><span>' + t + '단계</span><div class="nm-track" role="img" aria-label="' + t + '단계 정답률 ' + pc + '%"><div class="nm-fill' + (low ? ' low' : '') + '" style="width:' + pc + '%"></div></div><span>' + pc + '% (' + o.f + '/' + o.n + ')</span></div>';
    }).join('');
    if (bad.length) {
      list = '<div class="nm-wl"><div class="nm-sub" style="margin-bottom:calc(var(--u)*1)">📝 다시 살펴볼 문제 (' + bad.length + '개)</div>' + bad.map(function (x) {
        return '<div class="nm-item"><div class="ex">' + qExpr(x.p) + '</div>내가 쓴 답: ' + x.wrong.join(', ') + ' · 정답: <b>' + x.p.answer + '</b><br>' +
          '도움 보기: ' + (HELP === 'always' ? '항상 보이는 설정이었어요' : x.help ? '사용했어요' : '사용하지 않았어요') + (x.ok ? ' · 고쳐서 맞혔어요 👍' : '') + '<br>' + x.p.explain + '</div>';
      }).join('') + '</div>';
    }
    act = bad.length ? '<button class="nm-big" data-a="retry">🔁 틀린 문제 다시 풀기 (' + bad.length + '개)</button>' : '<div class="nm-ok">🎉 모두 맞혔어요!</div>';
    r('ana').innerHTML =
      '<div class="nm-sign" style="font-size:calc(var(--u)*3.8)">📊 내 계산 살펴보기</div>' +
      '<div class="nm-card2 wide"><div style="font-size:var(--fh)">단계별로 처음에 바로 맞힌 비율 (' + first + '/' + G.n + '개)</div><div class="nm-bars">' + bars + '</div>' +
      '<div class="nm-coach"><span>' + msg[0] + '</span><span>' + msg[1] + '</span></div>' +
      '<div style="font-size:var(--fh);margin-top:calc(var(--u)*.8)">💡 ' + (HELP === 'always' ? '도움 보기: 항상 보이기 모드' : '도움을 본 손님: ' + help + '명') + '</div></div>' +
      '<div class="nm-btns">' + act + '<button class="nm-sm" data-a="tosum">← 결과로</button></div>' + list;
    show('ana');
  }
  function startRetry() {
    var src = G.res.filter(function (x) { return !x.first; });
    if (!src.length) return;
    G = { retry: true, main: G.main || G, probs: src.map(function (x) { return x.p; }), n: src.length, i: 0, stars: 0, res: [], faces: shuffle(CUSTOMERS), cur: null, t0: Date.now(), t1: 0 };
    show('play');
    nextCustomer();
  }
  function showRetryResult() {
    var got = 0, left = 0, rows;
    G.res.forEach(function (x) { if (x.first) got++; else left++; });
    rows = G.res.map(function (x) {
      var done = x.p.expr.replace('?', x.p.answer).replace('□', x.p.answer);
      return '<div class="nm-item"><div class="ex">' + done + '</div>' +
        (x.first ? '✅ 바로 맞혔어요' : x.ok ? '👍 고쳐서 맞혔어요' : '🔁 정답은 ' + x.p.answer + '이에요. ' + x.p.explain) + '</div>';
    }).join('');
    r('rres').innerHTML =
      '<div class="nm-sign" style="font-size:calc(var(--u)*3.8)">🔁 다시 푼 결과</div>' +
      '<div class="nm-card2 wide"><div class="nm-big-n" style="font-size:calc(var(--u)*5)">' + got + ' / ' + G.n + '개</div>' +
      '<div style="font-size:var(--ft)">' + (left ? '👍 바로 맞힌 문제예요. 남은 문제도 한 번 더 도전해 봐요!' : '🎉 모두 맞혔어요! 정말 멋져요!') + '</div>' +
      '<div style="font-size:var(--fh);margin-top:calc(var(--u)*.6);color:#8A7466">원래 결과(정확도와 별 개수)는 그대로예요.</div></div>' +
      '<div class="nm-btns">' + (left ? '<button class="nm-big" data-a="retry">남은 문제 다시 풀기</button>' : '') +
      '<button class="nm-sm" data-a="toana">← 오답 분석으로</button><button class="nm-sm" data-a="tosum">← 결과로</button><button class="nm-sm" data-a="again">다시 하기</button></div>' +
      '<div class="nm-wl">' + rows + '</div>';
    show('rres');
  }

  /* ---------- 교사 설정 ---------- */
  var T = null, gate = null;
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  function numAsc(x, y) { return x - y; }
  function setMsg(t, bad) { var m = r('tmsg'); m.textContent = t; m.className = 'nm-tmsg' + (bad ? ' bad' : ''); }
  function validate() {
    var i, p;
    if (!T.levels.length) return '단계를 1개 이상 선택해 주세요.';
    if (T.levels.length > T.total) return '선택한 단계(' + T.levels.length + '개)가 손님 수(' + T.total + '명)보다 많아요. 손님 수를 늘리거나 단계를 줄여 주세요.';
    if (T.products.length < 3 || T.products.length > 12) return '상품은 3개~12개로 만들어 주세요.';
    for (i = 0; i < T.products.length; i++) {
      p = T.products[i];
      if (!clean(p[1])) return (i + 1) + '번째 상품의 이름이 비어 있어요. 이름을 입력해 주세요.';
      if (!clean(p[0])) return (i + 1) + '번째 상품의 이모지가 비어 있어요. 이모지를 입력해 주세요.';
    }
    return '';
  }
  function updateMsg() {
    var m = validate();
    setMsg(m || '✔ 단계 ' + T.levels.length + '개 · 손님 ' + T.total + '명 · 상품 ' + T.products.length + '개', !!m);
  }
  function syncOpts() {
    qa('[data-a="settotal"]').forEach(function (b) { b.classList.toggle('on', parseInt(b.getAttribute('data-v'), 10) === T.total); });
    qa('[data-a="sethelp"]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-v') === T.help); });
    qa('[data-a="tglv"]').forEach(function (b) { b.checked = T.levels.indexOf(parseInt(b.getAttribute('data-v'), 10)) >= 0; });
  }
  function renderProds() {
    r('tprods').innerHTML = T.products.map(function (p, i) {
      return '<div class="nm-prow"><input class="nm-ie" data-pi="' + i + '" data-pf="0" maxlength="10" value="' + esc(p[0]) + '" aria-label="' + (i + 1) + '번 상품 이모지">' +
        '<input class="nm-in" data-pi="' + i + '" data-pf="1" maxlength="8" placeholder="상품 이름" value="' + esc(p[1]) + '" aria-label="' + (i + 1) + '번 상품 이름">' +
        '<button data-a="delp" data-v="' + i + '" aria-label="' + (i + 1) + '번 상품 삭제">🗑</button></div>';
    }).join('');
    r('pcount').textContent = '(' + T.products.length + '/12개)';
  }
  function renderTeacher() {
    r('tbody').innerHTML =
      '<div class="nm-tsec"><h3>1. 연습할 단계</h3><div class="nm-seg">' +
        '<button data-a="quick" data-v="1-3">1~3단계(한 자리 수)</button><button data-a="quick" data-v="4-7">4~7단계(10과 십몇)</button>' +
        '<button data-a="quick" data-v="8-13">8~13단계(몇십·몇십몇)</button><button data-a="quick" data-v="0-0">모두 해제</button></div>' +
        '<div class="nm-chks">' + LEVELS.map(function (L) {
          return '<label class="nm-chk"><input type="checkbox" data-a="tglv" data-v="' + L.id + '"><span>' + L.id + '단계 ' + L.name + '</span></label>';
        }).join('') + '</div></div>' +
      '<div class="nm-tsec"><h3>2. 손님 수</h3><div class="nm-seg">' + [5, 10, 15].map(function (n) { return '<button data-a="settotal" data-v="' + n + '">' + n + '명</button>'; }).join('') + '</div></div>' +
      '<div class="nm-tsec"><h3>3. 상품 목록 <small data-r="pcount"></small></h3><div data-r="tprods"></div>' +
        '<div class="nm-seg"><button data-a="addp">➕ 상품 추가</button></div><div class="nm-note">상품은 3개~12개, 이름은 8글자까지 쓸 수 있어요.</div></div>' +
      '<div class="nm-tsec"><h3>4. 도움 보기 방식</h3><div class="nm-seg"><button data-a="sethelp" data-v="click">눌렀을 때만 보기</button><button data-a="sethelp" data-v="always">항상 보이기</button></div></div>' +
      '<div class="nm-tsec"><h3>5. 문제 범위 확인</h3><div class="nm-seg"><button data-a="examples">📖 단계별 예시 문제 보기</button></div></div>';
    renderProds(); syncOpts(); updateMsg(); r('tbody').scrollTop = 0;
  }
  function openTeacher() {
    T = { levels: levels.slice(), total: TOTAL, help: HELP, products: PRODUCTS.map(function (x) { return [x[0], x[1]]; }) };
    renderTeacher(); show('teach');
  }
  function saveTeacher() {
    var m = validate();
    if (m) { setMsg(m, true); return; }
    levels = T.levels.slice().sort(numAsc); sSet('levels', levels.join(','));
    TOTAL = T.total; HELP = T.help;
    PRODUCTS = T.products.map(function (x) { return [clean(x[0]), clean(x[1])]; });
    sSet('cfg', JSON.stringify({ total: TOTAL, help: HELP, products: PRODUCTS }));
    renderStart(); q('.nm-start').classList.remove('pick'); show('start');
  }
  function showExamples() {
    r('ex').innerHTML = '<div class="nm-sign" style="font-size:calc(var(--u)*3.8)">📖 단계별 예시 문제</div><div class="nm-list">' +
      LEVELS.map(function (L) {
        return '<div class="nm-item"><b>' + L.id + '단계 ' + L.name + '</b><div>' + makeSet(L, 3).map(function (p) {
          return '<span class="nm-exi">' + p.expr + ' <em>정답 ' + p.answer + '</em></span>';
        }).join('') + '</div></div>';
      }).join('') + '</div><div class="nm-btns"><button class="nm-big" data-a="toteach">← 설정으로</button></div>';
    show('ex');
  }
  function openGate(msg) {
    gate = { a: rnd(3, 9), b: rnd(6, 9) };
    r('gate').innerHTML = '<div class="nm-card nm-gate"><div class="em">🔒</div><h2>선생님 확인</h2><p style="font-size:calc(var(--u)*5)">' + gate.a + ' × ' + gate.b + ' = ?</p>' +
      '<input data-r="gin" inputmode="numeric" pattern="[0-9]*" maxlength="3" aria-label="정답"><div class="nm-tmsg bad">' + (msg || '&nbsp;') + '</div>' +
      '<div class="nm-btns"><button class="nm-big" data-a="gok">확인</button><button class="nm-sm" data-a="gcancel">취소</button></div></div>';
    r('gate').className = 'nm-pop on';
    setTimeout(function () { var i = r('gin'); if (i) i.focus(); }, 50);
  }
  function gateOk() {
    var i = r('gin');
    if (gate && i && parseInt(i.value, 10) === gate.a * gate.b) { r('gate').className = 'nm-pop'; r('gate').innerHTML = ''; openTeacher(); }
    else openGate('틀렸어요. 다시 풀어 보세요.');
  }

  /* ---------- 클릭 처리 ---------- */
  root.addEventListener('click', function (e) {
    var el = e.target, a, k;
    while (el && el !== root && !(el.getAttribute && (el.getAttribute('data-a') || el.getAttribute('data-k') !== null))) el = el.parentNode;
    if (!el || el === root) return;
    k = el.getAttribute('data-k');
    if (k !== null) {
      if (!G || r('pop').className.indexOf('on') > -1) return;
      if (input === '0') input = '';
      if (input.length < 3) input += k;
      renderDisp(); return;
    }
    a = el.getAttribute('data-a');
    if (a === 'start') startGame();
    else if (a === 'pick') { q('.nm-start').classList.add('pick'); }
    else if (a === 'pickdone') { q('.nm-start').classList.remove('pick'); }
    else if (a === 'setlv') {
      var v = parseInt(el.getAttribute('data-v'), 10), ix = levels.indexOf(v);
      if (ix >= 0) { if (levels.length > 1) levels.splice(ix, 1); }
      else { if (levels.length >= TOTAL) return; levels.push(v); levels.sort(function (x, y) { return x - y; }); }
      sSet('levels', levels.join(',')); renderStart();
    }
    else if (a === 'home' || a === 'again') { try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {} renderStart(); q('.nm-start').classList.remove('pick'); show('start'); }
    else if (a === 'del') { input = input.slice(0, -1); renderDisp(); }
    else if (a === 'ok') check();
    else if (a === 'help') { if (G && G.cur && !G.cur.helped && r('pop').className.indexOf('on') < 0) { G.cur.helped = true; setHint('💡 ' + G.cur.p.hint, false); renderPic(); } }
    else if (a === 'speak') { if (G && G.cur) speak(G.cur.p.story); }
    else if (a === 'next') { if (!G || r('pop').className.indexOf('on') < 0) return; G.i++; nextCustomer(); }
    else if (a === 'toana') showAnalysis();
    else if (a === 'tosum') showSummary();
    else if (a === 'retry') startRetry();
    else if (a === 'teacher') openGate();
    else if (a === 'gok') gateOk();
    else if (a === 'gcancel') { r('gate').className = 'nm-pop'; r('gate').innerHTML = ''; }
    else if (a === 'tglv') {
      var lv = parseInt(el.getAttribute('data-v'), 10), at = T.levels.indexOf(lv);
      if (el.checked && at < 0) T.levels.push(lv); else if (!el.checked && at >= 0) T.levels.splice(at, 1);
      T.levels.sort(numAsc); updateMsg();
    }
    else if (a === 'quick') {
      var pr = el.getAttribute('data-v').split('-'), qi; T.levels = [];
      if (pr[0] !== '0') for (qi = parseInt(pr[0], 10); qi <= parseInt(pr[1], 10); qi++) T.levels.push(qi);
      syncOpts(); updateMsg();
    }
    else if (a === 'settotal') { T.total = parseInt(el.getAttribute('data-v'), 10); syncOpts(); updateMsg(); }
    else if (a === 'sethelp') { T.help = el.getAttribute('data-v'); syncOpts(); updateMsg(); }
    else if (a === 'addp') {
      if (T.products.length >= 12) { setMsg('상품은 최대 12개까지 만들 수 있어요.', true); return; }
      T.products.push(['', '']); renderProds(); updateMsg();
      var ie = qa('.nm-ie'); if (ie.length) ie[ie.length - 1].focus();
    }
    else if (a === 'delp') {
      if (T.products.length <= 3) { setMsg('상품은 최소 3개가 있어야 해요.', true); return; }
      T.products.splice(parseInt(el.getAttribute('data-v'), 10), 1); renderProds(); updateMsg();
    }
    else if (a === 'examples') showExamples();
    else if (a === 'toteach') show('teach');
    else if (a === 'tsave') saveTeacher();
    else if (a === 'treset') {
      T = { levels: [1], total: 10, help: 'click', products: DEF_PRODUCTS.map(function (x) { return [x[0], x[1]]; }) };
      renderTeacher(); setMsg('기본값으로 되돌렸어요. [저장하고 돌아가기]를 눌러야 적용돼요.', false);
    }
  });

  root.addEventListener('click', function () { fitScreen(); });
  root.addEventListener('input', function (e) {
    var t = e.target, i = t.getAttribute && t.getAttribute('data-pi');
    if (i === null || i === undefined || !T) return;
    T.products[parseInt(i, 10)][parseInt(t.getAttribute('data-pf'), 10)] = t.value; updateMsg();
  });
  root.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.getAttribute && e.target.getAttribute('data-r') === 'gin') gateOk();
  });

  renderStart();
  fitScreen();
})();
</script>
</body>
</html>
